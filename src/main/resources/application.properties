spring.application.name=HungThinh-Management-BE
spring.config.import=optional:file:.env,optional:file:./DATN-HungThinh-Management-BE/.env
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#MOMO
MOMO_PARTNER_CODE=${MOMO_PARTNER_CODE}
MOMO_ACCESS_KEY=${MOMO_ACCESS_KEY}
MOMO_SECRET_KEY=${MOMO_SECRET_KEY}
MOMO_API_URL=${MOMO_API_URL}
MOMO_REDIRECT_URL=${MOMO_REDIRECT_URL}
MOMO_IPN_URL=${MOMO_IPN_URL}
MOMO_PUBLIC_IPN_URL=${MOMO_PUBLIC_IPN_URL:}
RESIDENT_RETURN_URL=${RESIDENT_RETURN_URL}

# VNPAY
VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
VNPAY_PAY_URL=${VNPAY_PAY_URL}
VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
VNPAY_RESIDENT_RETURN_URL=${VNPAY_RESIDENT_RETURN_URL}
VNPAY_IPN_URL=${VNPAY_IPN_URL}
VNPAY_ALLOW_REQUEST_RETURN_URL=${VNPAY_ALLOW_REQUEST_RETURN_URL:false}

# File Upload
file.upload-dir=uploads/contracts
meter-reading.upload-dir=uploads/meter-readings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini Admin Chat
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
